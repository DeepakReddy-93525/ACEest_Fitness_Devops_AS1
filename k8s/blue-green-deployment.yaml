# Blue Environment (Current Production)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-app-blue
  namespace: aceest-fitness
  labels:
    app: aceest-app
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-app
      version: blue
  template:
    metadata:
      labels:
        app: aceest-app
        version: blue
    spec:
      containers:
      - name: aceest-app
        image: tdeepakreddy/aceest-app:latest
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /programs
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /programs
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Green Environment (New Version)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-app-green
  namespace: aceest-fitness
  labels:
    app: aceest-app
    version: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-app
      version: green
  template:
    metadata:
      labels:
        app: aceest-app
        version: green
    spec:
      containers:
      - name: aceest-app
        image: tdeepakreddy/aceest-app:latest
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /programs
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /programs
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Blue Service (Points to Blue Environment)
apiVersion: v1
kind: Service
metadata:
  name: aceest-app-blue-service
  namespace: aceest-fitness
  labels:
    app: aceest-app
    version: blue
spec:
  selector:
    app: aceest-app
    version: blue
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
---
# Green Service (Points to Green Environment)
apiVersion: v1
kind: Service
metadata:
  name: aceest-app-green-service
  namespace: aceest-fitness
  labels:
    app: aceest-app
    version: green
spec:
  selector:
    app: aceest-app
    version: green
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
---
# Main Service (Switches between Blue and Green)
apiVersion: v1
kind: Service
metadata:
  name: aceest-app-main-service
  namespace: aceest-fitness
  labels:
    app: aceest-app
spec:
  selector:
    app: aceest-app
    version: blue  # Initially points to blue
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
