# Stable Version (Majority Traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-app-stable
  namespace: aceest-fitness
  labels:
    app: aceest-app
    version: stable
spec:
  replicas: 5
  selector:
    matchLabels:
      app: aceest-app
      version: stable
  template:
    metadata:
      labels:
        app: aceest-app
        version: stable
    spec:
      containers:
      - name: aceest-app
        image: tdeepakreddy/aceest-app:latest
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /programs
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /programs
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Canary Version (Small Traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-app-canary
  namespace: aceest-fitness
  labels:
    app: aceest-app
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-app
      version: canary
  template:
    metadata:
      labels:
        app: aceest-app
        version: canary
    spec:
      containers:
      - name: aceest-app
        image: tdeepakreddy/aceest-app:latest
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /programs
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /programs
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Stable Service (90% Traffic)
apiVersion: v1
kind: Service
metadata:
  name: aceest-app-stable-service
  namespace: aceest-fitness
  labels:
    app: aceest-app
    version: stable
spec:
  selector:
    app: aceest-app
    version: stable
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
---
# Canary Service (10% Traffic)
apiVersion: v1
kind: Service
metadata:
  name: aceest-app-canary-service
  namespace: aceest-fitness
  labels:
    app: aceest-app
    version: canary
spec:
  selector:
    app: aceest-app
    version: canary
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
